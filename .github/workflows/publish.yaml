name: Test, publish and update deployment
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'server.mjs'
      - 'package.json'
      - 'Dockerfile'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/publish.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check && npm test
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=0.1.0
            APP_COMMIT=${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Commit desired image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-image.mjs "$IMAGE" "$DIGEST"
          git add deploy/overlays/demo/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: update game image digest [skip ci]'
            git push origin HEAD:main
          fi
