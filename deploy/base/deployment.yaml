apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-games
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloud-native-games
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cloud-native-games
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: leaderboard
          persistentVolumeClaim:
            claimName: cloud-native-games-leaderboard
      containers:
        - name: game
          image: ghcr.io/stu-10/nkp-track-field-demo:bootstrap
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: leaderboard
              mountPath: /data
          env:
            - name: LEADERBOARD_DB
              value: /data/leaderboard.sqlite
            - name: DEMO_BANNER
              value: Built to run anywhere. Powered by NKP.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
